<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini API Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      hljs.highlightAll();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h1>Nada Essam</h1>
      </div>
      <div id="chatHistory" class="chat-history">
        <div class="message bot-message">Hello! How can I help you today?</div>
      </div>
      <div id="loadingIndicator" class="loading-indicator">Thinking..</div>
      <div class="input-area">
        <div id="filePreviewContainer" class="file-preview-container hidden">
          <span id="fileNameDisplay" class="file-name"></span>
          <span id="fileSizeDisplay" class="file-size"></span>
          <button id="clearFileButton" class="clear-file-button">X</button>
        </div>
        <div id="imagePreviewContainer" class="image-preview-container">
          <img
            id="imagePreview"
            class="image-preview"
            src="#"
            alt="Image Preview"
          />
          <button id="clearImageButton" class="clear-image-button hidden">
            X
          </button>
        </div>

        <div class="input-row">
          <label for="fileUpload" class="file-upload-label">
            📎 <input type="file" id="fileUpload" class="hidden-file-input" />
          </label>
          <label for="imageUpload" class="image-upload-label">
            📸
            <input
              type="file"
              id="imageUpload"
              accept="image/*"
              class="hidden-file-input"
            />
          </label>
          <textarea
            id="userInput"
            placeholder="Type your message..."
            rows="1"
          ></textarea>
          <button id="sendButton">Send</button>
        </div>
        <button id="newChatButton" class="new-chat-button">New Chat</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
